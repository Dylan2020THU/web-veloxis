<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="fig/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="fig/favicon.svg" />
    <link rel="shortcut icon" href="fig/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="fig/apple-touch-icon.png" />
    <link rel="manifest" href="fig/site.webmanifest" />
    <title>大川激流 Veloxis</title>
    <link rel="preload" as="image" href="fig/hero.webp" fetchpriority="high">
    <link rel="stylesheet" href="style.css?v=20261021-about-page">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <!-- 全站 Logo：fig/logo-cn.png（与 apps/shared/site-brand.ts 一致） -->
        <a href="#home" class="logo">
            <img src="fig/logo-cn.webp" alt="大川激流 Logo" class="logo-img">
        </a>
        <ul class="nav-links">
            <li><a href="#home">首页</a></li>
            <li><a href="#services">业务板块</a></li>
            <li><a href="about/">关于我们</a></li>
            <li><a href="#contact">加入我们</a></li>
        </ul>
        <div class="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- 英雄主视觉区 (Hero Section) -->
    <header id="home" class="hero">
        <video class="hero-video" muted loop playsinline preload="none" poster="fig/hero.webp">
            <source data-src="fig/veloxis-dynamic-bg.mp4" type="video/mp4">
            您的浏览器不支持视频背景。
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>
                融入、探索<br>
                智能时代激流
            </h1>
            <!-- <p>以创新驱动发展，用技术塑造未来，为您提供顶尖的智能科技解决方案。</p> -->
            <a href="#services" class="btn">了解业务</a>
        </div>
    </header>

    <!-- 业务板块 (Services Section) -->
    <section id="services" class="services-section">
        <div class="section-header">
            <h2>业务板块</h2>
            <p>为您提供全方位科技赋能服务</p>
        </div>
        
        <!-- 等距矩形布局 -->
        <div class="grid-container">
            <!-- 业务板块 1 - 产业智能软件（链接到 industry 子模块） -->
            <a href="industry/" class="card-link">
                <div class="card">
                    <img class="card-bg" src="fig/industry-cover.webp" alt="" loading="lazy" decoding="async">
                    <div class="card-content">
                        <h3>产业智能软件</h3>
                        <p>用AI赋能产业，让智能更简单</p>
                    </div>
                </div>
            </a>
            
            <!-- 业务板块 2 - 人工智能学习基地（链接到 roadmap 子模块） -->
            <a href="roadmap/" class="card-link">
                <div class="card">
                    <img class="card-bg" src="fig/learning-cover.webp" alt="" loading="lazy" decoding="async">
                    <div class="card-content">
                        <h3>人工智能学习基地</h3>
                        <p>前沿AI技术沉浸式学习平台</p>
                    </div>
                </div>
            </a>
            

            
            <!-- VeloxisAI科创投研 -->
            <a href="research/" class="card-link">
                <div class="card">
                    <img class="card-bg" src="fig/research-cover.webp" alt="" loading="lazy" decoding="async">
                    <div class="card-content">
                        <h3>VeloxisAI科创投研</h3>
                        <p>探索科创态势，连接技术与投资研究</p>
                    </div>
                </div>
            </a>

            <!-- 业务板块 3 -->
            <div class="card">
                <img class="card-bg" src="fig/development-cover.webp" alt="" loading="lazy" decoding="async">
                <div class="card-content">
                    <h3>开发中</h3>
                    <p>敬请期待</p>
                </div>
            </div>
            
        </div>
    </section>

    <!-- 合作伙伴 (Partners Section) -->
    <section id="partners" class="partners-section">
        <div class="section-header">
            <h2>合作伙伴</h2>
            <p>共建智能时代</p>
        </div>
        <div class="partners-grid">
            <div class="partner-logo">
                <img src="fig/logo图文-清华大学-透明底.png" alt="清华大学" loading="lazy">
            </div>
            <div class="partner-logo">
                <img src="fig/logo图文-武汉大学-透明底.png" alt="武汉大学" loading="lazy">
            </div>
            <div class="partner-logo">
                <img src="fig/logo图文-NUS-透明底.png" alt="新加坡国立大学（NUS）" loading="lazy">
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <div class="footer-content">
            <a href="#home" class="footer-back-top">返回顶部 ↑</a>
            <div class="footer-logo">大川激流</div>
            <p>北京市海淀区中关村东路123号</p>
            <p>邮箱: dylanzhang@veloxisai.com</p>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 北京大川激流科技有限公司. 保留所有权利。</p>
        </div>
    </footer>

    <!-- 滚动后显示的固定返回顶部按钮 -->
    <a href="#home" class="back-to-top" id="back-to-top" aria-label="返回顶部" title="返回顶部">
        <span aria-hidden="true">↑</span>
    </a>

    <script src="home-media.js" defer></script>
    <script>
        (function () {
            var btn = document.getElementById("back-to-top");
            if (!btn) return;
            function onScroll() {
                btn.classList.toggle("is-visible", window.scrollY > 480);
            }
            window.addEventListener("scroll", onScroll, { passive: true });
            onScroll();
        })();
    </script>
</body>
</html>
